name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=seinpy --cov-report=json:coverage.json

      - name: Generate badge files
        run: uv run python .github/scripts/generate_coverage_badge.py

      - name: Deploy to badges branch
        run: |
          mkdir -p /tmp/badges-export
          cp badges/coverage.json /tmp/badges-export/coverage.json
          if [ -f badges/coverage.svg ]; then
            cp badges/coverage.svg /tmp/badges-export/coverage.svg
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          if git show-ref --quiet refs/remotes/origin/badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/badges-export/coverage.json ./coverage.json
          if [ -f /tmp/badges-export/coverage.svg ]; then
            cp /tmp/badges-export/coverage.svg ./coverage.svg
          fi

          git add coverage.json
          if [ -f coverage.svg ]; then
            git add coverage.svg
          fi

          if git diff --staged --quiet; then
            echo "Coverage badge has not changed."
          else
            git commit -m "Update coverage badge [skip ci]"
            git push origin badges
          fi
